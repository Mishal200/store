{% extends 'base.html' %}
{% load static %}

{% block title %}Track Order{% endblock %}

{% block content %}



<div class="track-page">

    <div class="track-box">

        <div class="track-header">
            <h1>Track Order</h1>
            <span class="order-tag">#{{ order.order_number }}</span>
        </div>

        <div class="progress-wrapper">

            <div class="progress-step done">
                <div class="dot"></div>
                <div class="text">Order Confirmed</div>
            </div>

            <div class="progress-line"></div>

            <div class="progress-step done">
                <div class="dot"></div>
                <div class="text">Packed</div>
            </div>

            <div class="progress-line"></div>

            <div class="progress-step active">
                <div class="dot"></div>
                <div class="text">Shipped</div>
            </div>

        </div>

        <div class="info-grid">

            <div class="info-card">
                <div class="label">📍 Current Location</div>
                <div class="value">{{ order.current_location }}</div>
            </div>

            <div class="info-card highlight">
                <div class="label">🚚 Delivery</div>
                <div class="value">{{ order.estimated_delivery }}</div>
            </div>

        </div>

    </div>

</div>

{% endblock %}
