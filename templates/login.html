{% extends 'base.html' %}
{% load static %}

{% block title %}Login{% endblock %}

{% block content %}

<style>

.login-page {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #e3f2fd, #ffffff);
}

.login-box {
    width: 380px;
    background: #fff;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    text-align: center;
}

.login-box h2 {
    margin-bottom: 20px;
    font-weight: 700;
    color: #333;
}

.login-box input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: 1px solid #ddd;
    border-radius: 8px;
    outline: none;
    transition: 0.3s;
}

.login-box input:focus {
    border-color: #2874f0;
    box-shadow: 0 0 5px rgba(40,116,240,0.3);
}

.login-box button {
    width: 100%;
    padding: 12px;
    background: #2874f0;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
    transition: 0.3s;
}

.login-box button:hover {
    background: #0b5ed7;
}

.login-box .links {
    margin-top: 15px;
    font-size: 14px;
}

.login-box .links a {
    color: #2874f0;
    text-decoration: none;
    font-weight: 500;
}

.login-box .links a:hover {
    text-decoration: underline;
}
</style>

<div class="login-page">

    <div class="login-box">

        <h2>Login</h2>

        <form method="POST">
            {% csrf_token %}

            <input type="text" name="username" placeholder="Username" required>

            <input type="password" name="password" placeholder="Password" required>

            <button type="submit">Login</button>
        </form>

        <div class="links">
            <p>Don't have an account?
                <a href="{% url 'register' %}">Register</a>
            </p>
        </div>

    </div>

</div>

{% endblock %}
